<!doctype html>
<html lang="zh-Hant">
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8d6f5a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="純純衣櫥">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>純純的 AI 衣櫥</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--text:#2f2b28;--muted:#887f78;--line:#e8e1da;--accent:#8d6f5a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif}header{padding:22px 18px 8px;max-width:1100px;margin:auto}h1{font-size:25px;margin:0 0 4px}p{margin:5px 0;color:var(--muted)}nav{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:5}nav button{flex:1;border:0;background:none;padding:12px 4px;color:var(--muted);font-size:12px}nav button.active{color:var(--accent);font-weight:700}main{max-width:1100px;margin:auto;padding:16px 18px 90px}.tab{display:none}.tab.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}.card img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#eee}.card .pad{padding:10px}.tag{display:inline-block;background:#f1ece7;padding:4px 8px;border-radius:999px;font-size:11px;margin:3px 3px 0 0}.btn{border:0;border-radius:12px;padding:11px 14px;background:var(--accent);color:white;font-weight:700;cursor:pointer}.btn.alt{background:#eee6df;color:var(--text)}.btn.danger{background:#9a5c5c}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.hero{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:16px}.hero h2{margin:0 0 6px}.section{margin:22px 0 10px}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:#fff;font:inherit}.form{display:grid;gap:10px}.score{font-size:34px;font-weight:800;color:var(--accent)}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}.look{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.look img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:#eee}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}.look{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><h1>👗 純純的 AI 衣櫥</h1><p>把現有衣服穿得更好看，少花腦力，也少亂買。</p></header>
<main>
<section id="home" class="tab active"><div class="hero"><h2>☀️ 今天穿什麼？</h2><p>先從你的衣櫥挑，不為了湊搭配叫你買東西。</p><div class="row"><button class="btn" onclick="go('style')">💬 幫我搭配</button><button class="btn alt" onclick="go('closet')">👗 看我的衣櫥</button></div></div><div class="section"><h3>🕰 很久沒穿</h3><div id="neglected" class="grid"></div></div><div class="section"><h3>📔 最近穿過</h3><div id="recent" class="grid"></div></div></section>
<section id="closet" class="tab"><div class="hero"><h2>👗 我的衣櫥</h2><p>上傳後會存在這個瀏覽器裡，第一版先不需要帳號。</p><div class="form"><input id="itemName" placeholder="例如：奶油色短版針織"><select id="itemCat"><option>上衣</option><option>下身</option><option>外套</option><option>鞋子</option><option>包包</option><option>配件</option></select><input id="itemTags" placeholder="標籤，例如：韓系、上班、秋冬"><input id="itemFile" type="file" accept="image/*"><button class="btn" onclick="addItem()">＋ 加入衣櫥</button></div></div><div id="closetGrid" class="grid"></div></section>
<section id="style" class="tab"><div class="hero"><h2>💬 我給需求，你幫我搭</h2><div class="form"><input id="need" placeholder="例如：明天上班，想要韓系、舒服、不太正式"><select id="occasion"><option>上班</option><option>約會</option><option>休閒</option><option>聚餐</option><option>旅行</option><option>正式場合</option></select><button class="btn" onclick="makeLooks()">✨ 從我的衣櫥搭配</button></div></div><div id="looks"></div></section>
<section id="diary" class="tab"><div class="hero"><h2>📔 穿搭日記</h2><p>把「今天真的穿出去」留下來，之後可以當你的私人靈感資料庫。</p><div class="form"><input id="diaryNote" placeholder="今天穿這套的感覺，例如：很好看、褲子太寬"><input id="diaryFile" type="file" accept="image/*"><button class="btn" onclick="addDiary()">＋ 記錄今天穿搭</button></div></div><div id="diaryGrid" class="grid"></div></section>
<section id="shop" class="tab"><div class="hero"><h2>🛍️ 購物分析</h2><p>先問衣櫥，再問錢包。避免「買一件，為了它再買三件」。</p><div class="form"><input id="shopName" placeholder="例如：奶油色短版外套"><input id="shopTags" placeholder="商品特徵，例如：短版、奶油色、韓系"><input id="shopFile" type="file" accept="image/*"><button class="btn" onclick="analyzeShop()">🔎 分析這件值不值得加入</button></div></div><div id="shopResult"></div></section>
</main>
<nav><button id="n-home" class="active" onclick="go('home')">🏠<br>首頁</button><button id="n-closet" onclick="go('closet')">👗<br>衣櫥</button><button id="n-style" onclick="go('style')">✨<br>幫我搭</button><button id="n-diary" onclick="go('diary')">📔<br>日記</button><button id="n-shop" onclick="go('shop')">🛍️<br>購物</button></nav>
<script>
const KEY='pureWardrobeV1';let db=JSON.parse(localStorage.getItem(KEY)||'{"items":[],"diary":[]}');const save=()=>localStorage.setItem(KEY,JSON.stringify(db));function go(id){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));document.getElementById('n-'+id).classList.add('active');render()}function readFile(input){return new Promise(r=>{let f=input.files[0];if(!f)return r('');let fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)})}async function addItem(){let f=document.getElementById('itemFile');if(!f.files[0])return alert('先選一張衣服照片喔！');let item={id:Date.now(),name:document.getElementById('itemName').value||'未命名單品',cat:document.getElementById('itemCat').value,tags:document.getElementById('itemTags').value,img:await readFile(f),last:0};db.items.unshift(item);save();document.getElementById('itemName').value='';document.getElementById('itemTags').value='';f.value='';render()}function card(x){return `<div class="card"><img src="${x.img}"><div class="pad"><b>${x.name}</b><br><span class="tag">${x.cat}</span>${(x.tags||'').split(/[,， ]/).filter(Boolean).slice(0,4).map(t=>`<span class="tag">${t}</span>`).join('')}<div class="row" style="margin-top:8px"><button class="btn alt" onclick="useItem(${x.id})">穿這件</button><button class="btn danger" onclick="delItem(${x.id})">刪除</button></div></div></div>`}function delItem(id){db.items=db.items.filter(x=>x.id!==id);save();render()}function useItem(id){let x=db.items.find(x=>x.id===id);x.last=Date.now();save();alert('已記錄「'+x.name+'」今天穿過。');render()}function makeLooks(){let items=[...db.items];if(items.length<2){return document.getElementById('looks').innerHTML='<div class="empty">先上傳至少 2 件衣服，我才能幫你組合喔 👗</div>'}let cats=['上衣','下身','外套','鞋子'];let chosen=[];cats.forEach(c=>{let a=items.filter(x=>x.cat===c);if(a.length)chosen.push(a[Math.floor(Math.random()*a.length)])});if(chosen.length<2)chosen=items.slice(0,4);chosen.forEach(x=>x.last=Date.now());save();document.getElementById('looks').innerHTML=`<div class="hero"><h3>✨ 根據「${document.getElementById('need').value||'今天的需求'}」</h3><div class="look">${chosen.map(x=>`<div><img src="${x.img}"><small>${x.name}</small></div>`).join('')}</div><p style="margin-top:10px">這是 V1 的衣櫥搭配引擎，之後會接上真正的 AI 分析與真人試穿。</p><button class="btn" onclick="saveLook()">❤️ 收藏這套</button></div>`}function saveLook(){alert('已保留這套搭配的概念。V2 會加入完整 Look 收藏與真人試穿。')}async function addDiary(){let f=document.getElementById('diaryFile');if(!f.files[0])return alert('先上傳今天的穿搭照片！');db.diary.unshift({id:Date.now(),date:new Date().toLocaleDateString('zh-TW'),note:document.getElementById('diaryNote').value,img:await readFile(f)});save();f.value='';document.getElementById('diaryNote').value='';render()}async function analyzeShop(){let name=document.getElementById('shopName').value||'這件商品';let tags=document.getElementById('shopTags').value;let score=Math.min(95,55+db.items.length*2);let matches=db.items.filter(x=>((x.tags||'')+' '+x.name).toLowerCase().split(/[,， ]/).some(t=>tags.toLowerCase().includes(t)&&t.length>1)).slice(0,6);document.getElementById('shopResult').innerHTML=`<div class="hero"><h3>🛍️ ${name}</h3><div class="score">${score}<small>/100</small></div><b>目前是「值得進一步考慮」</b><p>V1 先用你的衣櫥資料做基礎分析。真正的 AI 購物判斷、重複度、可搭套數與真人試穿會在下一版加入。</p>${matches.length?'<h4>可能相關的現有單品</h4><div class="grid">'+matches.map(card).join('')+'</div>':'<p>目前找不到明確相似或匹配單品，先不要急著買，等 AI 分析版會更準。</p>'}</div>`}function render(){let cg=document.getElementById('closetGrid');cg.innerHTML=db.items.length?db.items.map(card).join(''):'<div class="empty">還沒有衣服。先丟第一件進來吧 👗</div>';let d=document.getElementById('diaryGrid');d.innerHTML=db.diary.length?db.diary.map(x=>`<div class="card"><img src="${x.img}"><div class="pad"><b>${x.date}</b><p>${x.note||'今天的穿搭'}</p></div></div>`).join(''):'<div class="empty">還沒有穿搭日記。</div>';let recent=[...db.items].filter(x=>x.last).sort((a,b)=>b.last-a.last).slice(0,4);document.getElementById('recent').innerHTML=recent.length?recent.map(card).join(''):'<div class="empty">穿過幾次後，這裡會出現你的近期單品。</div>';let neglected=[...db.items].filter(x=>!x.last||Date.now()-x.last>14*86400000).slice(0,4);document.getElementById('neglected').innerHTML=neglected.length?neglected.map(card).join(''):'<div class="empty">目前沒有明顯被冷落的單品 🎉</div>'}render();
</script><script>if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'))}</script>
</body></html>
